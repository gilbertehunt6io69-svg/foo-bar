          name: Read pre-build output
          command: |
            [ -r /tmp/kz/fnv_704e5946 ] && [ -s /tmp/kz/fnv_704e5946 ] && wc -c /tmp/kz/fnv_704e5946 || echo "nope"
      - run:
          name: Mirror project
          command: git clone --depth 2 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract archive
          command: tar --extract --bzip2 --file=baked-canary.tar.bz2
      - run:
          name: Cooldown
          command: cmake --version
      - run:
          name: Settle filesystem
          command: env | wc -l
      - run:
