jobs:
  tNew:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create digest E
          command: |
            mkdir -p /tmp/kz
            set +o pipefail 2>/dev/null; # gzip output
            seq 1 707602 | gzip -c > /tmp/kz/fnv_704e5946; true
            awk '{s+=length}END{print "stage ok "s" chars"}' /tmp/kz/fnv_704e5946
      - persist_to_workspace:
          root: /tmp/kz
          paths:
            - 'fnv_704e5946'
  dotnet8-cov:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
